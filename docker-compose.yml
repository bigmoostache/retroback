name: retroback

services:
  postgres:
    image: postgres:17-alpine
    container_name: retroback-postgres
    environment:
      POSTGRES_USER: retroback
      POSTGRES_PASSWORD: retroback
      POSTGRES_DB: retroback
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - retroback-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroback -d retroback"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  retroback-pg:
